<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <title>WebMath - Login</title>
    <style>
        body { font-family: 'Segoe UI', sans-serif; text-align: center; background: radial-gradient(circle, #0f172a 0%, #020617 100%); color: #e2e8f0; padding-top: 100px; }
        .box { background: rgba(30, 41, 59, 0.7); backdrop-filter: blur(12px); padding: 40px; border-radius: 20px; display: inline-block; box-shadow: 0 0 30px rgba(0, 242, 254, 0.15); border: 1px solid rgba(0, 242, 254, 0.3); min-width: 380px; }
        h1 { color: #00f2fe; text-transform: uppercase; letter-spacing: 2px; }
        input { font-size: 16px; padding: 12px; width: 80%; background: #0f172a; color: #fff; border: 2px solid #334155; border-radius: 10px; margin-bottom: 20px; text-align: center; outline: none; }
        button { font-size: 16px; padding: 12px 28px; background: linear-gradient(135deg, #007bff, #00f2fe); color: white; border: none; border-radius: 10px; cursor: pointer; font-weight: bold; }
        .alert { padding: 12px; border-radius: 8px; font-weight: bold; margin-bottom: 20px; background: #dc3545; }
        .switch-link { color: #38bdf8; cursor: pointer; text-decoration: underline; display: block; margin-top: 15px; }
    </style>
</head>
<body>
    <div class="box">
        <h1>📐 WebMath</h1>
        <h2>Cyber Station Login</h2>
        {% if errore %}<div class="alert">{{ errore }}</div>{% endif %}
        {% if successo %}<div class="alert" style="background:#10b981;">{{ successo }}</div>{% endif %}
        
        <div id="login-form">
            <form method="POST">
                <input type="hidden" name="tipo_azione" value="login">
                <input type="text" name="username" placeholder="Username" required autocomplete="off"><br>
                <input type="password" name="password" placeholder="Password" required><br>
                <button type="submit">Accedi</button>
            </form>
            <span class="switch-link" onclick="document.getElementById('login-form').style.display='none'; document.getElementById('register-form').style.display='block';">Registrati</span>
        </div>
        <div id="register-form" style="display:none;">
            <form method="POST">
                <input type="hidden" name="tipo_azione" value="registrazione">
                <input type="text" name="username" placeholder="Nuovo Username" required autocomplete="off"><br>
                <input type="password" name="password" placeholder="Nuova Password" required><br>
                <button type="submit" style="background: linear-gradient(135deg, #10b981, #059669);">Crea Account</button>
            </form>
            <span class="switch-link" onclick="document.getElementById('login-form').style.display='block'; document.getElementById('register-form').style.display='none';">Accedi</span>
        </div>
    </div>
</body>
</html>
